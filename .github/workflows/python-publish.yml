# Builds the distribution and publishes it to PyPI via Trusted Publishing when a release is
# published. For more information see:
# https://docs.pypi.org/trusted-publishers/using-a-publisher/
#
# Third-party actions are pinned to full commit SHAs (version in the trailing comment) so that a
# moved tag or branch upstream cannot change the code that runs here. Dependabot keeps the pins
# current (.github/dependabot.yml).
#
# The build and the upload run in separate jobs: only the publish job holds `id-token: write`,
# and it runs nothing but the pinned publish action on the artifact produced by the build job.

name: Upload Python Package

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read # needed to check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: python -m pip install -r .github/requirements/build.txt
      - name: Build package
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/.github/requirements/build.txt
        run: python -m build
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  pypi-publish:
    name: upload release to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment in the repository settings.
    environment:
      name: pypi
      url: https://pypi.org/p/kensho-kfinance
    permissions:
      id-token: write # mandatory for PyPI Trusted Publishing; scoped to this job only
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
